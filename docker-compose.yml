services:
  server:
    image: nodejspro-nest-server:prod
    build:
      context: .
      target: runner
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: app
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 300M
